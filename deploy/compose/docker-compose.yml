services:
  postgres:
    image: postgres:16
    # A self-hosted install has to survive a host reboot without someone SSHing in to start it again.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  easydocs:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      collabora:
        condition: service_started
    env_file: .env
    environment:
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      BLOB_ROOT: /data/blobs
      Jwt__Secret: ${Jwt__Secret}
      # Compose-network URLs: no app↔Collabora TLS here — the edge proxy terminates TLS (spec §11).
      WOPI_HOST_URL: ${WOPI_HOST_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      COLLABORA_URL: ${COLLABORA_URL}
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "8080:8080"
    volumes:
      - blobs:/data/blobs

  collabora:
    image: collabora/code
    restart: unless-stopped
    environment:
      # Collabora vets the host it is asked to call, and that host comes out of WOPISrc — which is
      # WOPI_HOST_URL, not PUBLIC_BASE_URL. Allowlisting only the browser-facing name made coolwsd
      # refuse every session with "No authorized hosts found matching the target host [easydocs]",
      # surfacing in the editor as "Unauthorized WOPI host" (spec §6.1). Both names, aliased.
      aliasgroup1: ${WOPI_HOST_URL},${PUBLIC_BASE_URL}
      # ssl.termination tells coolwsd whether something in front of it terminates TLS; it is what the
      # editor page uses to build its own wss:// vs ws:// socket URL. Hard-coded true, it handed every
      # browser a wss:// URL for a coolwsd that speaks plain HTTP ("Looks like SSL/TLS traffic on plain
      # http port"), so the editor never finished loading on the default stack. It now follows
      # PUBLIC_BASE_URL's scheme: false for the plain-http default, true for a real https deployment
      # behind the edge proxy (spec §11) — set both together in .env.
      extra_params: "--o:ssl.enable=false --o:ssl.termination=${COLLABORA_SSL_TERMINATION:-false}"
    ports: [ "9980:9980" ]
    cap_add: [ MKNOD ]

volumes:
  pgdata:
  blobs:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  easydocs:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      collabora:
        condition: service_started
    env_file: .env
    environment:
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      BLOB_ROOT: /data/blobs
      Jwt__Secret: ${Jwt__Secret}
      # Compose-network URLs: no app↔Collabora TLS here — the edge proxy terminates TLS (spec §11).
      WOPI_HOST_URL: ${WOPI_HOST_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      COLLABORA_URL: ${COLLABORA_URL}
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "8080:8080"
    volumes:
      - blobs:/data/blobs

  collabora:
    image: collabora/code
    environment:
      aliasgroup1: ${PUBLIC_BASE_URL}          # allowlist the app host (spec §6.1)
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
    ports: [ "9980:9980" ]
    cap_add: [ MKNOD ]

volumes:
  pgdata:
  blobs:

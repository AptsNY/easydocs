name: Use a fast apt mirror
description: >
  Point apt at archive.ubuntu.com instead of the runners' default azure.archive.ubuntu.com, which on
  2026-08-19 trickled multi-MB packages (43 MB of libreoffice-core in >4.5 min, ~19.5 min of font
  packages in web-e2e) and hung three jobs past their entire time budgets.

  Lives here rather than inline because all three apt-using jobs need it: duplicating the snippet is
  what produced the first, broken version. That one edited only sources.list and *.sources — but
  noble runners resolve sources through `URIs: mirror+file:/etc/apt/apt-mirrors.txt`, so the
  hostname it needed to rewrite was in the mirrorlist, and the sed silently changed nothing while
  looking like a fix. Hence the verification below: a swap that does not apply must fail loudly, not
  quietly leave the slow mirror in place.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # Every file apt reads for source definitions, mirrorlist included.
        sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
          /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true

        if grep -qs 'azure\.archive\.ubuntu\.com' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; then
          echo "::error::apt still points at the azure mirror — the swap missed a config file"
          grep -ls 'azure\.archive\.ubuntu\.com' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* || true
          exit 1
        fi
        echo "apt mirror is archive.ubuntu.com"

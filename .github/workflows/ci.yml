name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore .NET
        run: dotnet restore

      - name: Build .NET
        run: dotnet build --no-restore -c Release

      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # Without this the two PDF tests SKIP here, and a skip reads as coverage that does not exist. The
      # release gate installs LibreOffice, so the first environment ever to execute them was the v1.0.0
      # tag — where one of them failed on an assertion that had been wrong since it was written. A test
      # whose only runtime is the release gate is a test that fails at the worst possible moment.
      - name: Install LibreOffice (so the PDF tests run instead of skipping)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice

      # ubuntu-latest runners ship Docker, so Testcontainers can start Postgres.
      # With LibreOffice installed above, nothing here is allowed to skip: a silent skip is how the
      # wrong PDF assertion survived all the way to the release gate. One run, both checks.
      - name: Test
        run: |
          set -o pipefail
          dotnet test --no-build -c Release 2>&1 | tee /tmp/test.log
          if grep -qE "Skipped: +[1-9]" /tmp/test.log; then
            echo "::error::a test skipped in an environment where every dependency is installed"
            exit 1
          fi

  # The Playwright suite against the SHIPPED IMAGE, not the Vite dev server. That is the whole point:
  # only the container exercises MapFallbackToFile, static assets out of wwwroot, and the /s/{token}
  # index.html lookup, and it is the only place browser HTTP caching sees production cache headers. It
  # paid for itself immediately — three share specs that were green under Vite failed here, because the
  # negotiated /s/{token} shell was being replayed out of the browser cache over the SPA's JSON fetch
  # (fixed in de46163). Passing under Vite proves strictly less.
  #
  # Boot sequence copied from conformance.yml on purpose: one pattern for "run against the real
  # artefact", not two that drift apart. The stack includes Collabora, which is what lets
  # collabora.spec.ts close spec §12.3's headless-browser requirement here rather than in a fourth job.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      # The Dockerfile builds the SPA itself (node stage -> COPY into wwwroot), so there is no separate
      # frontend build step here — a second mechanism would just be a second thing to get out of sync.
      - name: Boot the compose stack
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          # Never ship the example secret, even to a throwaway CI stack.
          python3 - <<'PY'
          import re, secrets, pathlib
          p = pathlib.Path('.env')
          p.write_text(re.sub(r'^Jwt__Secret=.*$', f'Jwt__Secret={secrets.token_urlsafe(48)}',
                              p.read_text(), flags=re.M))
          PY
          docker compose up -d --build

      - name: Wait for the stack to come up
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::easydocs did not become healthy within 90s"
          exit 1

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Playwright against the shipped image
        working-directory: web
        env:
          # playwright.config.ts skips its own webServer when this is set and drives this URL instead.
          E2E_BASE_URL: http://localhost:8080
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx playwright test --reporter=github,html,json

      # Playwright exits 0 on a skip, and a skipped spec reads as coverage that does not exist — the same
      # rule that keeps conformance.yml honest, so it needs the same explicit assertion.
      - name: Assert no E2E spec skipped
        working-directory: web
        run: |
          n=$(python3 -c 'import json; print(json.load(open("playwright-results.json"))["stats"]["skipped"])')
          [ "$n" = 0 ] || { echo "::error::$n E2E specs skipped; every §9 screen must actually be driven"; exit 1; }
          echo "no E2E spec skipped."

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            web/playwright-results.json
          retention-days: 7

      - name: Compose logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  # Prove the documentation site builds. --strict turns a warning into a failure, which is the whole
  # point: mkdocs reports a dead internal link or a missing nav page as a warning and would otherwise
  # exit 0, so the docs would rot silently between releases. `validation:` in mkdocs.yml promotes
  # absolute and unrecognised links to warnings too, so --strict catches those as well.
  #
  # On PRs this job is only the build gate; on a push to main the built site is also published to
  # GitHub Pages by docs-deploy below. Same build both times — what the gate validated is exactly
  # what gets deployed.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build the docs site
        working-directory: docs-site
        run: mkdocs build --strict

      - name: Upload the site as a Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  docs-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to Pages
      id-token: write   # OIDC token that authenticates the deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  dco-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every PR commit is signed off (DCO)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $c is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed. Sign off every commit with 'git commit -s'."
            exit 1
          fi
          echo "All PR commits are signed off."

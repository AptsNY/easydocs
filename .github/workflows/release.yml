name: Release

# Fires on a pushed version tag. The tag is the trigger AND the version: the image tag, the release
# name, and the pinned reference in the shipped compose bundle all derive from it, so there is no
# second place to bump and forget.
#
# Tags are expected to be signed (`git tag -s`). This workflow does not verify that — GitHub shows
# Verified/Unverified on the tag itself, and failing a release because a signing key was not set up
# would be a worse outcome than publishing an unverified one and fixing it.
on:
  push:
    tags: ["v*"]

# Least privilege, per job below. `packages: write` pushes to GHCR, `id-token: write` is what makes
# cosign keyless signing work (the OIDC token IS the identity), `contents: write` creates the release.
permissions:
  contents: read

env:
  # Hardcoded lowercase, NOT ${{ github.repository_owner }}: the owner is `AptsNY`, and a registry
  # reference must be lowercase — `ghcr.io/AptsNY/easydocs` is rejected outright with "invalid
  # reference format", which would fail the push, the cosign sign, and the bundle pin. A workflow-level
  # `env:` cannot call `toLower()`, so the literal is the fix.
  IMAGE: ghcr.io/aptsny/easydocs

jobs:
  # Gate the release on the same suites that guard main. A tag must not be able to publish an image
  # that CI would have rejected — a release is the one build nobody re-runs before trusting it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # E6 asserts a rendered PDF. Without soffice the criterion skips itself, which reads as coverage
      # that does not exist — the same reason conformance.yml installs it.
      - name: Install LibreOffice (so the PDF tests run instead of skipping)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Build and test
        run: |
          dotnet build easydocs.slnx -c Release
          dotnet test easydocs.slnx --no-build -c Release

      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      packages: write   # push to GHCR
      id-token: write   # cosign keyless: the OIDC token is the signing identity
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version from the tag
        id: v
        run: |
          # refs/tags/v1.0.0 -> 1.0.0
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=${{ env.IMAGE }}:$version" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU is what makes the arm64 half of the build possible on an amd64 runner. v1.0.0 shipped
      # amd64-only, which fails `docker compose up` on every Apple Silicon Mac and ARM server
      # (Graviton, Raspberry Pi) with "no matching manifest for linux/arm64/v8" — the quickstart's
      # first command, dead on arrival for that whole audience.
      - name: Set up QEMU (for the arm64 build)
        uses: docker/setup-qemu-action@v3

      # The existing multi-stage Dockerfile: node builds the SPA into wwwroot, the dotnet runtime stage
      # bundles LibreOffice for PDF rendering. One Dockerfile, used by dev, CI and release alike.
      # All three base images (node, dotnet/sdk, dotnet/aspnet) are multi-arch, so the same Dockerfile
      # builds both platforms.
      #
      # `digest` is what gets signed. Signing a mutable tag would be signing a pointer, not an artifact:
      # `latest` moves on the next release and the signature would then attest to the wrong image.
      # With two platforms the digest is the manifest list's — one signature covers both.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.ref }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (Fulcio/Rekor via the workflow's OIDC identity). No long-lived key in a repo secret to
      # leak or rotate; the signature attests "built by this workflow in this repo at this ref", which
      # is the claim a self-hoster actually wants to check. Verify with:
      #   cosign verify ghcr.io/<owner>/easydocs:<version> \
      #     --certificate-identity-regexp '^https://github\.com/<owner>/easydocs/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image by digest
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # Generated, never hand-maintained: the dev compose builds from source, which a downloaded
      # bundle cannot do. Deriving it here means the two definitions cannot drift — there is only one.
      - name: Build the release bundle
        run: |
          mkdir -p bundle
          .github/scripts/gen-release-compose.sh \
            "${{ steps.v.outputs.ref }}" \
            deploy/compose/docker-compose.yml \
            bundle/docker-compose.yml
          cp deploy/compose/.env.example bundle/.env.example
          cp LICENSE bundle/LICENSE
          # Fail loudly rather than shipping a bundle that still builds from source. Written as an
          # explicit `if`, not `! grep -q`: errexit does not apply to a negated pipeline, so the
          # negated form is a guard that can never fire — it passed a deliberately matching file.
          grep -q "image: ${{ steps.v.outputs.ref }}" bundle/docker-compose.yml
          if grep -q "build:" bundle/docker-compose.yml; then
            echo "::error::the release bundle still builds from source"
            exit 1
          fi
          tar -czf "easydocs-${{ steps.v.outputs.version }}-compose.tar.gz" -C bundle .

      # Notes come from CHANGELOG.md, which is curated by milestone, rather than from raw commit
      # subjects — a reader wants "what changed for me", not 28 conventional-commit lines.
      - name: Extract the changelog section
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for ${{ steps.v.outputs.version }}; falling back to the tag message." > notes.md
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" >> notes.md
          fi
          {
            echo
            echo "### Verifying this release"
            echo
            echo '```'
            echo "cosign verify ${{ steps.v.outputs.ref }} \\"
            echo "  --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            easydocs-${{ steps.v.outputs.version }}-compose.tar.gz
            deploy/compose/.env.example

name: Conformance

# The v1 conformance profile (spec §12.1 E1-E12) as a gate, run against the real deployment artifact
# (spec §12.3). Separate from ci.yml on purpose: ci.yml stays the fast unit+Testcontainers signal,
# this job builds an image and boots LibreOffice and Collabora, so it is minutes not seconds.
#
# How each criterion is exercised:
#
#   Pure API (xUnit suite, in-process host + Testcontainers Postgres)
#     E1  Folders          nesting, move-preserves-history/members, promote-vs-trash
#     E2  Ingest           local multipart only, first version 0.0.1
#     E5  Numbering        R1-R6 + manual override, R8 download names
#     E6  Publish          renumber + Major Versions (PDF leg below)
#     E7  Approvals        published-only, one row per approver, single immutable decision, cancel
#     E8  Actions          all 8 v1 actions, incl. Push To Copy (M4)
#     E9  Copies           isolated members/history, non-member push -> pending review, accept ->
#                          incoming_push branch, reject -> hidden + pusher notified, merge into main
#                          via the fork-point branch root, and no master draft reachable from a copy
#     E10 Share/download   version-scoped, revocable, audited, docx + pdf, no cloud export
#     E11 Revert           new head equals target, history intact
#     E12 Security         role matrix x endpoint, org-role grants nothing, token <= owner role
#
#   WOPI protocol round trip (xUnit suite plays Collabora's side: LOCK + PutFile)
#     E3  Edit/version     save creates a version, unchanged re-save does not, author/time/summary
#     E4  Branch/merge     two sessions on one head -> two branches, merge attributes the incoming author
#     This is the protocol's branch coverage, NOT a substitute for §12.3's headless-browser driver.
#     Treating it as one hid a total failure of browser editing for four milestones (CheckFileInfo went
#     out camelCase; every assertion here deserialises case-insensitively). The browser driver is
#     web/e2e/collabora.spec.ts and runs in ci.yml's web-e2e job, which already boots Collabora.
#
#   Compose stack (conformance-smoke.sh, against the published image over HTTP)
#     E6's PDF leg          bundled LibreOffice actually renders (%PDF verified)
#     E2/E6/E10 end-to-end  PAT-only create -> upload -> publish -> share -> anonymous read
#     §10.1 surface         /openapi/v1.json is 3.1 and publishes the complete endpoint set (the
#                           copies/push routes landed in M4); /docs is self-contained
#
# As of M4 every criterion E1-E12 runs for real: NOTHING in this suite is allowed to skip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # E6 asserts a rendered PDF. Without soffice on the runner that criterion skips itself, which
      # would make a green run overstate coverage — so install it and let the assertion run for real.
      - name: Install LibreOffice (so E6's PDF criterion runs instead of skipping)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version

      - name: Run the E1-E12 conformance suite
        run: |
          dotnet test -c Release --filter 'FullyQualifiedName~Conformance' \
            --logger 'console;verbosity=normal' \
            --logger 'trx;LogFileName=conformance.trx'

      # A silently-skipped criterion is worse than a red one: it reads as coverage that does not exist.
      # M4 was the last milestone with a pending criterion, so the allowlist is now empty — every one of
      # E1-E12 must actually run. The only reason anything here skips is a missing host dependency
      # (LibreOffice for E6's PDF leg), which this job installs above precisely so it does not.
      - name: Assert no conformance criterion skipped
        run: |
          trx=$(find . -name conformance.trx | head -1)
          if [ -z "$trx" ]; then echo "::error::no trx produced"; exit 1; fi
          python3 - "$trx" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          skipped = [r.get('testName') for r in root.findall('.//t:UnitTestResult', ns)
                     if r.get('outcome') in ('NotExecuted', 'Skipped')]
          for s in skipped:
              print(f'UNEXPECTED SKIP  {s}')
          if skipped:
              print(f'::error::{len(skipped)} conformance criteria skipped; E1-E12 must all run as of M4')
              sys.exit(1)
          print('no conformance criterion skipped — E1-E12 all ran.')
          PY

      - name: Boot the compose stack (Postgres + Collabora + bundled LibreOffice)
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          # Never ship the example secret, even to a throwaway CI stack.
          python3 - <<'PY'
          import re, secrets, pathlib
          p = pathlib.Path('.env')
          p.write_text(re.sub(r'^Jwt__Secret=.*$', f'Jwt__Secret={secrets.token_urlsafe(48)}',
                              p.read_text(), flags=re.M))
          PY
          docker compose up -d --build

      - name: Wait for the stack to come up
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::easydocs did not become healthy within 90s"
          exit 1

      - name: Conformance smoke against the shipped image
        run: bash .github/scripts/conformance-smoke.sh

      - name: Compose logs
        if: always()
        working-directory: deploy/compose
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
